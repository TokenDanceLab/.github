# TokenDanceLab — Reusable GHCR Image Build & Push
#
# Usage (in consuming repo):
#   jobs:
#     build:
#       uses: TokenDanceLab/.github/.github/workflows/cd-ghcr-image.yml@main
#       with:
#         image_name: ghcr.io/tokendancelab/my-service
#         context: .
#         dockerfile: Dockerfile
#       secrets: inherit

name: CD — GHCR Image Build & Push

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: "Full GHCR image name, e.g. ghcr.io/tokendancelab/my-service"
      context:
        required: false
        type: string
        default: "."
        description: "Docker build context path"
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
        description: "Path to Dockerfile"
      platforms:
        required: false
        type: string
        default: "linux/amd64"
        description: "Build platforms (comma-separated)"

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: [us1, ubuntu-latest]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
