name: CI — Go Service

# Callable L1 Go CI. Policy: github-actions-ci-cd-policy.md §4
on:
  workflow_call:
    inputs:
      go_version:
        required: false
        type: string
        default: "1.26"
      working_directory:
        required: false
        type: string
        default: "."
      run_govulncheck:
        required: false
        type: boolean
        default: true
      govulncheck_blocking:
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-go-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Go CI
    # runs-on array is AND (all labels), NOT priority fallback.
    # Policy: L1 on self-hosted runner. Hybrid fallback needs a routing job — see server policy §4.2.
    runs-on: [self-hosted, '${{ vars.RUNNER_LABEL || ''self-hosted'' }}']
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Lint (non-blocking)
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ inputs.working_directory }}

      - name: Vulnerability check (govulncheck)
        if: inputs.run_govulncheck
        continue-on-error: ${{ !inputs.govulncheck_blocking }}
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
