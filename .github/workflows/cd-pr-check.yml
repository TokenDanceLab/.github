name: CD — PR Deploy Check

on:
  workflow_call:
    inputs:
      compose_file:
        required: false
        type: string
        default: "docker-compose.yml"
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"

concurrency:
  group: cd-pr-check-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Deployment Files
    # AND labels; self-hosted runner only.
    runs-on: [self-hosted, '${{ vars.RUNNER_LABEL || ''self-hosted'' }}']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose YAML
        run: |
          python3 -c "import yaml; yaml.safe_load(open('${{ inputs.compose_file }}'))"
          echo "Compose YAML valid"

      - name: Validate Dockerfile exists
        run: |
          if [ -f "${{ inputs.dockerfile }}" ]; then
            echo "Dockerfile exists"
          else
            echo "Dockerfile not found at ${{ inputs.dockerfile }}"
            exit 1
          fi
